<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Pytania</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom, white, red);
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

h1, button {
    position: relative;
    z-index: 1;
    text-align: center;
}

h1 {
    font-size: 36px;
    color: black;
    margin-bottom: 30px;
}

button {
    padding: 15px 40px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background-color: black;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #333;
    transform: scale(1.05);
}
</style>
</head>
<body>

<h1>Hejka kocie <3</h1>
<button onclick="window.location.href='pytanie1.html'">dalej</button>

<script>
function createHeart() {
    const img = document.createElement('img');
    img.src = 'heart.png'; // Twój PNG
    img.style.position = 'absolute';
    
    const size = 20 + Math.random() * 40; // 20-60px
    img.style.width = size + 'px';
    img.style.height = size + 'px';
    
    img.style.left = Math.random() * window.innerWidth + 'px';
    img.style.bottom = '-50px'; // start poza ekranem
    img.style.opacity = '1';
    
    document.body.appendChild(img);

    const duration = 3000 + Math.random() * 2000; // 3-5s

    // zmiana pozycji po minimalnym opóźnieniu, żeby transition zadziałało
    setTimeout(() => {
        img.style.transition = `transform ${duration}ms linear, opacity ${duration}ms linear`;
        img.style.transform = `translateY(-${window.innerHeight + 50}px)`; // lecimy w górę
        img.style.opacity = '0';
    }, 50);

    // usuń po animacji
    setTimeout(() => img.remove(), duration + 100);
}

// generowanie co 300ms
setInterval(createHeart, 300);
</script>

</body>
</html>
