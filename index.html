<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pytania</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(to right, red, white);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: black;
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: black;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: #333;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Czy jesteś gotowy na kilka pytań?</h1>

    <button onclick="location.href='pytanie.html'">
        Tak
    </button>

</body>
</html>
