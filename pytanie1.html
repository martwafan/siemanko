<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybierz postać</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .heart-wrapper {
            position: relative;
            width: 350px;
            height: 320px;
        }

        .heart {
            position: absolute;
            width: 180px;
            height: 180px;
            background: black;
            top: 70px;
            left: 85px;
            transform: rotate(-45deg);
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background: black;
            border-radius: 50%;
        }

        .heart:before {
            top: -90px;
            left: 0;
        }

        .heart:after {
            left: 90px;
            top: 0;
        }

        .content {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 40px;
            color: white;
        }

        h1 {
            margin-bottom: 20px;
        }

        .characters {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .character {
            cursor: pointer;
            transition: 0.3s;
        }

        .character img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid white;
        }

        .character:hover {
            transform: scale(1.1);
        }

        .character p {
            margin-top: 5px;
            font-size: 14px;
            color: white;
        }
    </style>
</head>
<body>

    <div class="heart-wrapper">
        <div class="heart"></div>

        <div class="content">
            <h1>Wybierz postać</h1>

            <div class="characters">
                <div class="character" onclick="window.location.href='strona1.html'">
                    <img src="https://via.placeholder.com/70" alt="Postać 1">
                    <p>Postać 1</p>
                </div>

                <div class="character" onclick="window.location.href='strona1.html'">
                    <img src="https://via.placeholder.com/70" alt="Postać 2">
                    <p>Postać 2</p>
                </div>

                <div class="character" onclick="window.location.href='strona1.html'">
                    <img src="https://via.placeholder.com/70" alt="Postać 3">
                    <p>Postać 3</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
