<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybierz odpowiedź</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .heart-wrapper {
            position: relative;
            width: 450px;   /* większe serce */
            height: 400px;
        }

        .heart {
            position: absolute;
            width: 220px;
            height: 220px;
            background: black;
            top: 90px;
            left: 115px;
            transform: rotate(-45deg);
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            background: black;
            border-radius: 50%;
        }

        .heart:before {
            top: -110px;
            left: 0;
        }

        .heart:after {
            left: 110px;
            top: 0;
        }

        .content {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50px;
            color: white;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
        }

        .answers {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .answer {
            cursor: pointer;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            color: white;
            background-color: black;
            transition: 0.3s;
        }

        .answer:hover {
            background-color: #333;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="heart-wrapper">
        <div class="heart"></div>

        <div class="content">
            <h1>Czy zostaniesz moją walentynką?</h1>

            <div class="answers">
                <button class="answer" onclick="window.location.href='tak1.html'">Tak!</button>
                <button class="answer" onclick="window.location.href='nie1.html'">Nie…</button>
            </div>
        </div>
    </div>

</body>
</html>
