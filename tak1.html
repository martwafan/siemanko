<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tak!</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle, white 0%, red 100%);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

/* Centralne serca jako PNG */
.heart-wrapper {
    position: relative;
    width: 400px;
    height: 400px;
    z-index: 1;
}

.heart-wrapper img.heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* GIF w środku najmniejszego serca */
.heart-wrapper img.gif {
    position: absolute;
    top: 47%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
}

/* przycisk pod sercem */
.content {
    position: absolute;
    top: 80%;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 1;
}

button {
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin: 0 10px;
    background-color: black;
    color: white;
    transition: 0.3s;
}

button:hover {
    background-color: #333;
    transform: scale(1.05);
}
</style>
</head>
<body>

<div class="heart-wrapper">
    <img src="serce_czerwone.png" class="heart" style="width:370px; height:370px; z-index:1;">
    <img src="serce_biale.png" class="heart" style="width:330px; height:330px; z-index:2;">
    <img src="serce_czarne.png" class="heart" style="width:270px; height:270px; z-index:3;">
    <img src="serce_czerwone.png" class="heart" style="width:220px; height:220px; z-index:4;">
    <img src="serce_biale.png" class="heart" style="width:170px; height:170px; z-index:5;">
    <!-- GIF w środku -->
    <img src="https://media1.tenor.com/m/RiZpodi6JD0AAAAC/fast-cat-cat-excited.gif" class="gif" style="z-index:6;">
</div>


<script>
// Funkcja tworząca latające PNG serduszka
function createFlyingHeart() {
    const img = document.createElement('img');
    img.src = 'serce.png'; // Twój PNG serca
    img.style.position = 'absolute';
    
    const size = 20 + Math.random() * 40; // losowy rozmiar
    img.style.width = size + 'px';
    img.style.height = size + 'px';
    
    img.style.left = Math.random() * window.innerWidth + 'px';
    img.style.bottom = '-50px';
    
    const duration = 3000 + Math.random() * 3000; // czas lotu 3-6s
    img.style.transition = `transform ${duration}ms linear, opacity ${duration}ms linear`;
    
    document.body.appendChild(img);
    
    setTimeout(() => {
        img.style.transform = `translateY(-${window.innerHeight + 50}px)`;
        img.style.opacity = '0';
    }, 50);
    
    setTimeout(() => img.remove(), duration + 100);
}

// Tworzenie serduszek co 300ms
setInterval(createFlyingHeart, 300);
</script>

</body>
</html>
